user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression for modern browser optimization
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================
    # HTTP Server: Redirects all traffic to HTTPS
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name _; # Catch-all for VPS IP

        # Redirect any HTTP request to the same URL on HTTPS
        return 301 https://$host$request_uri;
    }

    # ==========================================
    # HTTPS Server: Handles SSL and Proxies to FastAPI
    # ==========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # SSL Certificates (Path inside the NGINX container)
        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # SSL Security Settings (Disables old vulnerable protocols)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # NGINX Basic Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;           # Prevents Clickjacking
        add_header X-XSS-Protection "1; mode=block" always;       # Prevents Cross-Site Scripting
        add_header X-Content-Type-Options "nosniff" always;       # Prevents MIME-sniffing
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # HSTS

        # Max body size configuration
        client_max_body_size 20M;

        # Root Location Proxying to FastAPI Service
        location / {
            proxy_pass http://web:8000;
            
            # Standard Proxy Headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Proxy Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Custom Nginx Error Pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}